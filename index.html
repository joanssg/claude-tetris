<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="title-bar">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro" aria-pressed="false">☀️</button>
    <h1 class="game-title">TETRIS</h1>
  </div>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value combo-value" id="combo">-</span>
        </div>
        <div class="panel-section">
          <span class="label">BACK-TO-BACK</span>
          <span class="value combo-value" id="b2b">-</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
          <span id="freeze" class="freeze hidden"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd>/<kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> sonido</li>
            <li>💣 bomba ⚡ rayo 🎨 tinte ⬇️ gravedad ❄️ congelar (cada 5 líneas)</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="banner" class="banner"></div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="rec-over" class="rec-section hidden">
          <p id="rec-msg" class="rec-msg"></p>
          <form id="rec-form" class="rec-form" autocomplete="off">
            <input id="rec-name" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Nombre" />
            <button id="rec-save" type="submit">Guardar</button>
          </form>
          <div id="rec-over-table"></div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="rec-start" class="overlay">
      <div class="overlay-box">
        <p class="rec-title">TETRIS</p>
        <p class="rec-sub">RECORDS</p>
        <div id="rec-start-table"></div>
        <button id="rec-play" type="button">Jugar</button>
        <button id="rec-reset" class="rec-reset" type="button">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
